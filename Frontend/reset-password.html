<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password – SmartAlumni</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d1a;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    .card {
      background: #181830;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    h2 { font-size: 22px; margin-bottom: 8px; }
    p { font-size: 13px; color: #888; margin-bottom: 24px; }
    label { font-size: 13px; color: #aaa; display: block; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px;
      background: #f0f4ff; color: #111;
      border: none; border-radius: 8px;
      font-size: 14px; margin-bottom: 16px;
      outline: none;
    }
    button {
      width: 100%; padding: 13px;
      background: #4f6ef7; color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #3a58e0; }
    button:disabled { background: #555; cursor: not-allowed; }
    .msg { margin-top: 16px; font-size: 14px; text-align: center; }
    .msg.success { color: #4caf50; }
    .msg.error { color: #f44336; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔒 Reset Password</h2>
    <p>Enter your new password below to reset your account.</p>

    <label for="new-password">New Password</label>
    <input type="password" id="new-password" placeholder="Enter new password" />

    <label for="confirm-password">Confirm Password</label>
    <input type="password" id="confirm-password" placeholder="Confirm new password" />

    <button id="reset-btn" onclick="doReset()">Reset Password</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const API = 'http://localhost:8080/api';

    function getTokenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    function doReset() {
      const token = getTokenFromUrl();
      if (!token) { showMsg('Invalid or missing reset token.', 'error'); return; }

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!newPassword || newPassword.length < 6) {
        showMsg('Password must be at least 6 characters.', 'error'); return;
      }
      if (newPassword !== confirmPassword) {
        showMsg('Passwords do not match.', 'error'); return;
      }

      const btn = document.getElementById('reset-btn');
      btn.disabled = true;
      btn.textContent = 'Resetting...';

      fetch(`${API}/auth/reset-password?token=${encodeURIComponent(token)}&newPassword=${encodeURIComponent(newPassword)}`, {
        method: 'POST'
      })
        .then(async r => {
          const data = await r.json();
          if (!r.ok) throw new Error(data.message || 'Reset failed');
          showMsg('✅ Password reset! Redirecting to login...', 'success');
          setTimeout(() => window.location.href = '/Frontend/index.html', 2500);
        })
        .catch(e => {
          showMsg('❌ ' + e.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        });
    }
  </script>
</body>
</html>
